# Quicx Benchmark Config — 10 MB pool, optimal PMAD layout
# Task payload distribution for a typical background-job workload:
#   Small control messages  (32B)  : heartbeats, ready/done signals
#   Typical task metadata   (64B)  : task type + small args
#   Medium payloads        (128B)  : JSON small args, IDs
#   Large payloads         (256B)  : standard task bodies
#   Large payloads         (512B)  : bigger task bodies / blobs
#   Max payloads          (1024B)  : large serialised data
#
# Percentages tuned so that the most common sizes (64-256B)
# get the lion's share and never exhaust under sustained load.
[server]
port = 16381

[allocator]
pool_size = 10485760
class = 32,5
class = 64,25
class = 128,30
class = 256,25
class = 512,10
class = 1024,5
