# quicx.conf — settings for `quicx start --config quicx.conf`
#
# Every key is optional. A missing key keeps the built-in default, and the
# values below ARE the built-in defaults: `quicx start` without --config
# runs exactly like this. The command line wins over the file (--port).

[server]
port = 16381            # TCP port for producers and workers

[memory]
pool_size = 8M          # the whole memory budget, never exceeded (K, M, G count in 1024s).
                        # 3 pages of it hold connections and workers, the rest holds tasks

[allocator]
# apool v2 features. What each one buys and costs is measured in docs/report.
reserve       = on      # the last free pages only go to a block size that owns none yet,
                        # so one size cannot lock all others out (Linux watermarks, memcached)
hardening     = on      # free-list links are encoded; double frees and overwritten links
                        # are caught (mimalloc secure mode)
purge         = on      # empty pages give their memory back to the OS after a burst
                        # (jemalloc, mimalloc)
fullest_first = off     # take blocks from the fullest page first (Hoard). Measured: no gain
                        # on queue traffic, so it is off
warm_pages    = auto    # empty pages kept ready before purging; auto = 1/8 of the pages
reserve_pages = auto    # free pages the reserve holds back; auto = 1/64 of the pages
admission     = value   # when the budget is full: refuse the new task, evict the oldest
                        # waiting one, or (value) evict a waiting task of a lower value
                        # level. A task is only evicted if its memory fits the new one;
                        # with every task at the same level, value refuses like 1.x
