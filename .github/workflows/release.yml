name: Build & Publish Release

# Trigger by pushing a semver tag, e.g.:
#   git tag v1.0.2
#   git push origin v1.0.2
# The tag (minus the leading "v") becomes the release VERSION.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"        # e.g. "v1.0.2"
          VERSION="${TAG#v}"              # -> "1.0.2"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive a version from tag '$TAG'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release version: $VERSION"

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build cross-platform release binaries
        run: make release VERSION=${{ steps.version.outputs.version }}

      - name: List built artifacts
        run: ls -lh "releases/v${{ steps.version.outputs.version }}"

      - name: Publish folder to Quicx-Releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SRC="releases/v$VERSION"

          if [ -z "${RELEASES_TOKEN:-}" ]; then
            echo "::error::Secret RELEASES_REPO_TOKEN is not set. Add a PAT with write access to Quicx-Engine/Quicx-Releases."
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${RELEASES_TOKEN}@github.com/Quicx-Engine/Quicx-Releases.git" \
            releases-repo

          DEST="releases-repo/releases/v$VERSION"
          if [ -d "$DEST" ]; then
            echo "::warning::releases/v$VERSION already exists in Quicx-Releases; overwriting its contents."
          fi
          mkdir -p "$DEST"
          cp -R "$SRC/." "$DEST/"

          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/v$VERSION"

          if git diff --cached --quiet; then
            echo "Nothing changed — releases/v$VERSION is already up to date."
          else
            git commit -m "Add release v$VERSION"
            git push origin HEAD:main
            echo "Published releases/v$VERSION to Quicx-Engine/Quicx-Releases."
          fi
