<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Quicx v1.0.4 vs v2.0.0"><title>Quicx v1.0.4 vs v2.0.0</title><desc>v2.0.0 fits 46,593 tasks of 100 B in 8 MiB where v1.0.4 fits 655, and holds about 2 MB instead of 9 MB after a burst, on macOS and Linux</desc><!-- icons: Lucide (ISC licence, see icons/LICENSE-lucide.txt) --><defs><marker id="mS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#7d9099"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#ff5700"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#22343c"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5f68"/></marker></defs><rect width="1600" height="640" fill="#ffffff"/><text x="60" y="70" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0a171d" text-anchor="start">v1.0.4 → v2.0.0</text><text x="60" y="104" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#22343c" text-anchor="start">measured on an Apple M4 Pro (macOS) and an Intel Core i3-2100 (Linux), default 8 MiB budget</text><rect x="60" y="132" width="16" height="16" rx="3" fill="#93a7b1"/><text x="86" y="146" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#22343c" text-anchor="start">v1.0.4  (PMAD, fixed size classes)</text><rect x="365.712" y="132" width="16" height="16" rx="3" fill="#ff5700"/><text x="391.712" y="146" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#22343c" text-anchor="start">v2.0.0  (apool v2, adaptive pages)</text><rect x="60" y="180" width="720" height="400" rx="10" fill="#f5f8f9" stroke="#c5d1d7" stroke-width="1.5"/><text x="88" y="222" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0a171d" text-anchor="start">Tasks of 100 B that fit</text><text x="88" y="250" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5f68" text-anchor="start">same count on both machines · higher is better</text><text x="88" y="337" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#22343c" text-anchor="start">v1.0.4</text><path d="M210,316 H213.07850000000002 Q216.157,316 216.157,319.0785 V342.9215 Q216.157,346 213.07850000000002,346 H210 Z" fill="#93a7b1"/><text x="228.157" y="338" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0a171d" text-anchor="start">655</text><text x="88" y="433" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#22343c" text-anchor="start">v2.0.0</text><path d="M210,412 H643.9742 Q647.9742,412 647.9742,416 V438 Q647.9742,442 643.9742,442 H210 Z" fill="#ff5700"/><text x="659.9742" y="434" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0a171d" text-anchor="start">46,593</text><text x="88" y="540" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#c94401" text-anchor="start">71× more in the same memory</text><rect x="820" y="180" width="720" height="400" rx="10" fill="#f5f8f9" stroke="#c5d1d7" stroke-width="1.5"/><text x="848" y="222" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0a171d" text-anchor="start">Memory held after a burst</text><text x="848" y="250" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5f68" text-anchor="start">KB of physical memory once the queue drains · lower is better</text><text x="848" y="300" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5f68" text-anchor="start">Apple M4 Pro, macOS</text><text x="848" y="336" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#22343c" text-anchor="start">v1.0.4</text><path d="M1000,314 H1391.6 Q1395.6,314 1395.6,318 V338 Q1395.6,342 1391.6,342 H1000 Z" fill="#93a7b1"/><text x="1407.6" y="335" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0a171d" text-anchor="start">9,200</text><text x="848" y="384" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#22343c" text-anchor="start">v2.0.0</text><path d="M1000,362 H1085.44 Q1089.44,362 1089.44,366 V386 Q1089.44,390 1085.44,390 H1000 Z" fill="#ff5700"/><text x="1101.44" y="383" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0a171d" text-anchor="start">2,080</text><text x="848" y="440" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5f68" text-anchor="start">Intel i3-2100, Linux</text><text x="848" y="476" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#22343c" text-anchor="start">v1.0.4</text><path d="M1000,454 H1422.904 Q1426.904,454 1426.904,458 V478 Q1426.904,482 1422.904,482 H1000 Z" fill="#93a7b1"/><text x="1438.904" y="475" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0a171d" text-anchor="start">9,928</text><text x="848" y="524" font-family="'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#22343c" text-anchor="start">v2.0.0</text><path d="M1000,502 H1113.648 Q1117.648,502 1117.648,506 V526 Q1117.648,530 1113.648,530 H1000 Z" fill="#ff5700"/><text x="1129.648" y="523" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0a171d" text-anchor="start">2,736</text><text x="60" y="618" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#687c85" text-anchor="start">Source: docs/report (raw runs in docs/report/results). macOS memory is phys_footprint, Linux memory is resident set size.</text></svg>
