<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-label="Quicx 2.0.0 benchmarks"><title>Quicx 2.0.0 benchmarks</title><desc>Quicx 2.0.0: 81,900 tasks per second at 49 µs median latency on an Apple M4 Pro, 46,593 tasks of 100 B in 8 MiB, and about 2 MB of memory held after a burst, on macOS and Linux</desc><!-- icons: Lucide (ISC licence, see icons/LICENSE-lucide.txt) --><defs><marker id="mS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5f68"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#ff5700"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#c3ced5"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a1b0b9"/></marker></defs><rect width="1600" height="860" fill="#0a171d"/><text x="60" y="70" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#edf2f5" text-anchor="start">Quicx 2.0.0, measured</text><text x="60" y="104" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#c3ced5" text-anchor="start">Apple M4 Pro (macOS) and Intel Core i3-2100 (Linux) · default 8 MiB budget · C clients over loopback · medians of repeated runs</text><rect x="60" y="130" width="355" height="116" rx="10" fill="#0e1e25" stroke="#27383f" stroke-width="1.5"/><text x="84" y="190" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#edf2f5" text-anchor="sta