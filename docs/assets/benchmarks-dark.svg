xt><text x="1209" y="224" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#a1b0b9" text-anchor="start">after a burst drains, M4 Pro</text><rect x="60" y="276" width="480" height="520" rx="10" fill="#0e1e25" stroke="#27383f" stroke-width="1.5"/><text x="84" y="316" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#edf2f5" text-anchor="start">Latency, submit → done</text><text x="84" y="342" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1b0b9" text-anchor="start">µs · open loop at 40k/s (M4 Pro) and 9k/s (i3)</text><rect x="84" y="368" width="14" height="14" rx="3" fill="#ff5700"/><text x="106" y="380" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#c3ced5" text-anchor="start">M4 Pro</text><rect x="204" y="368" width="14" height="14" rx="3" fill="#5f7681"/><text x="226" y="380" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#c3ced5" text-anchor="start">i3-2100</text><text x="84" y="442" font-family="'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="400" fill="#c3ced5" text-anchor="start">p50</text><path d="M160,412 H222.8181818181818 Q226.8181818181818,412 226.8181818181818,416 V432 Q226.8181818181818,436 222.8181818181818,436 H160 Z" fill="#ff5700"/><text x="236.8181818181818" y="430" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#edf2f5" text-anchor="start">49</text><path d="M160,442 H323.72727272727275 Q327.72727272727275,442 327.72727272727275,446 V462 Q327.72727272727275,466 323.72727272727275,466 H160 Z" fill="#5f7681"/><text x="337.72727272727275" y="460" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#edf2f5" text-anchor="start">123</text><text x="84" y="534" font-family="'JetBrains Mono', Men